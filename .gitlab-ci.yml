# Until lossik/device-communication 3.0.0 is released, tools/ci.sh clones its branch DC_REF (step 3).
unit:
  image: $PHP_IMAGE
  timeout: 15m
  variables:
    DC_REF: feature/3.0
    DC_URL: http://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab:8929/lossik/device-communication.git
  parallel:
    matrix:
      - PHP_IMAGE:
          - php:8.2.35-cli
          - php:8.3.36-cli
          - php:8.4.27-cli
          - php:8.5.12-cli
  script:
    - bash tools/ci.sh

chr:
  image: php:8.2.35-cli
  timeout: 20m
  variables:
    CHR_VERSION: "7.24.5"
    CHR_CACHE: $CI_PROJECT_DIR/.cache/chr
    DC_REF: feature/3.0
    DC_URL: http://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab:8929/lossik/device-communication.git
  cache:
    key: chr-$CHR_VERSION
    paths:
      - .cache/chr
  script:
    - bash tools/chr/run-live.sh
  after_script:
    - bash tools/chr/chr.sh stop
