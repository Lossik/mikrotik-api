unit:
  image: $PHP_IMAGE
  timeout: 15m
  parallel:
    matrix:
      - PHP_IMAGE:
          - php:8.2.35-cli
          - php:8.3.36-cli
          - php:8.4.27-cli
          - php:8.5.12-cli
  script:
    - bash tools/ci.sh

# Lowest allowed version of every dependency: checks the lower bounds in composer.json (one PHP version is enough).
lowest:
  image: php:8.2.35-cli
  timeout: 15m
  script:
    - bash tools/ci.sh --prefer-lowest

chr:
  image: php:8.2.35-cli
  timeout: 20m
  variables:
    CHR_VERSION: "7.24.5"
    CHR_CACHE: $CI_PROJECT_DIR/.cache/chr
  cache:
    key: chr-$CHR_VERSION
    paths:
      - .cache/chr
  script:
    - bash tools/chr/run-live.sh
  after_script:
    - bash tools/chr/chr.sh stop
