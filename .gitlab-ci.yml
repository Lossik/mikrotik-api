# Until lossik/device-communication 3.0.0 is released, tools/ci.sh clones its branch DC_REF (step 3).
unit:
  image: $PHP_IMAGE
  timeout: 15m
  variables:
    DC_REF: feature/3.0
    DC_URL: http://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab:8929/lossik/device-communication.git
  parallel:
    matrix:
      - PHP_IMAGE:
          - php:8.2.35-cli
          - php:8.3.36-cli
          - php:8.4.27-cli
          - php:8.5.12-cli
  script:
    - bash tools/ci.sh

chr:
  image: php:8.2.35-cli
  timeout: 20m
  variables:
    CHR_CACHE: $CI_PROJECT_DIR/.cache/chr
    DC_REF: feature/3.0
    DC_URL: http://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab:8929/lossik/device-communication.git
  cache:
    key: chr-$CHR_VERSION
    paths:
      - .cache/chr
  parallel:
    matrix:
      - CHR_VERSION:
          - "7.24.5"
          - "6.49.18"
  script:
    - bash tools/chr/tests/run.sh
    - bash tools/chr/run-live.sh
  after_script:
    - bash tools/chr/chr.sh stop

chr:schedule:
  image: php:8.2.35-cli
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    CHR_CACHE: $CI_PROJECT_DIR/.cache/chr
    DC_REF: feature/3.0
    DC_URL: http://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab:8929/lossik/device-communication.git
  cache:
    key: chr-$CHR_VERSION
    paths:
      - .cache/chr
  parallel:
    matrix:
      - CHR_VERSION:
          - "7.23.8"
          - "7.17.2"
          - "7.16.2"
          - "7.12.2"
          - "7.1"
          - "6.49.23"
          - "6.43"
          - "6.42.12"
  script:
    - bash tools/chr/tests/run.sh
    - bash tools/chr/run-live.sh
  after_script:
    - bash tools/chr/chr.sh stop

chr:schedule:6.34:
  image: php:8.2.35-cli
  timeout: 20m
  retry: 2
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    CHR_VERSION: "6.34"
    CHR_CACHE: $CI_PROJECT_DIR/.cache/chr
    DC_REF: feature/3.0
    DC_URL: http://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab:8929/lossik/device-communication.git
  cache:
    key: chr-6.34
    paths:
      - .cache/chr
  script:
    - bash tools/chr/tests/run.sh
    - bash tools/chr/run-live.sh
  after_script:
    - bash tools/chr/chr.sh stop

chr:schedule:7.25rc3:
  image: php:8.2.35-cli
  timeout: 20m
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    CHR_VERSION: "7.25rc3"
    CHR_CACHE: $CI_PROJECT_DIR/.cache/chr
    DC_REF: feature/3.0
    DC_URL: http://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab:8929/lossik/device-communication.git
  cache:
    key: chr-7.25rc3
    paths:
      - .cache/chr
  script:
    - bash tools/chr/tests/run.sh
    - bash tools/chr/run-live.sh
  after_script:
    - bash tools/chr/chr.sh stop
