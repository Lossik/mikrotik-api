unit:
  image: $PHP_IMAGE
  timeout: 15m
  parallel:
    matrix:
      - PHP_IMAGE:
          - php:8.2.35-cli
          - php:8.3.36-cli
          - php:8.4.27-cli
          - php:8.5.12-cli
  script:
    - bash tools/ci.sh

chr:
  image: php:8.2.35-cli
  timeout: 20m
  variables:
    CHR_CACHE: $CI_PROJECT_DIR/.cache/chr
  parallel:
    matrix:
      - CHR_VERSION:
          - "7.24.5"
          - "6.49.18"
  script:
    - bash tools/chr/tests/run.sh
    - |
      bash tools/chr/run-live.sh || {
        rc=$?
        if [ "$rc" = 78 ]; then
          echo "RouterOS $CHR_VERSION unavailable; see the GitHub matrix availability issue"
        else
          exit "$rc"
        fi
      }
  after_script:
    - bash tools/chr/chr.sh stop
