name: Latest RouterOS

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routeros-latest
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_sha: ${{ steps.discover.outputs.code_sha }}
      matrix: ${{ steps.discover.outputs.matrix }}
      has_new: ${{ steps.discover.outputs.has_new }}
      channel_heads: ${{ steps.discover.outputs.channel_heads }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - id: discover
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('code_sha', require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim());
            await require('./tools/chr/github.cjs').discover({github, context, core})

  test:
    needs: discover
    if: needs.discover.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      CHR_VERSION: ${{ matrix.version }}
      CHR_CHANNELS: ${{ toJSON(matrix.channels) }}
      CHR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.code_sha }}
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Verify official SHA256 and run live suite
        run: |
          set -o pipefail
          mkdir -p .cache/chr
          docker run --rm --device /dev/kvm -v "$PWD:/app" -v "$PWD/.cache/chr:/cache" \
            -e CHR_CACHE=/cache -e CHR_VERSION -e CHR_CHANNELS -e CHR_RUN_URL \
            -w /app php:8.2.35-cli bash tools/chr/latest-run.sh 2>&1 | tee .routeros-live.log
      - name: Report failed suite
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const log = fs.existsSync('.routeros-live.log') ? fs.readFileSync('.routeros-live.log', 'utf8') : '';
            await require('./tools/chr/github.cjs').report({github, context}, process.env.CHR_VERSION, false,
              `Channels: ${process.env.CHR_CHANNELS}\n\n\`\`\`text\n${log.slice(-15000)}\n\`\`\``);
      - name: Report removed image
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const row = JSON.parse(require('node:fs').readFileSync('.routeros-result.json', 'utf8'));
            if (row.result === 'unavailable') await require('./tools/chr/github.cjs').report({github, context}, row.version, true);
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeros-result-${{ matrix.version }}
          path: .routeros-result.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routeros-log-${{ matrix.version }}
          path: |
            .routeros-live.log
            .routeros-junit.xml
          include-hidden-files: true

  record:
    needs: [discover, test]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHR_CHANNEL_HEADS: ${{ needs.discover.outputs.channel_heads }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.code_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.discover.outputs.has_new == 'true'
        with:
          pattern: routeros-result-*
          path: .routeros-artifacts
      - name: Collect records
        run: |
          mkdir -p .routeros-results
          if [ -d .routeros-artifacts ]; then
            for dir in .routeros-artifacts/*; do
              cp "$dir/.routeros-result.json" ".routeros-results/$(basename "$dir").json"
            done
          fi
      - uses: actions/github-script@v7
        with:
          script: await require('./tools/chr/github.cjs').publish({github, context})
