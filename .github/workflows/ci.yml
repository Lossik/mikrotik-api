name: CI

on:
  push:
    branches: [master, 3.x, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  chr-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Data writer and notification tests
        run: node tools/chr/tests/github-test.cjs
      - id: matrix
        run: echo "matrix=$(docker run --rm -v "$PWD:/app" -w /app php:8.2.35-cli php tools/chr/tested.php matrix)" >> "$GITHUB_OUTPUT"

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - php:8.2.35-cli
          - php:8.3.36-cli
          - php:8.4.27-cli
          - php:8.5.12-cli
    steps:
      - uses: actions/checkout@v4

      - name: tools/ci.sh in ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/app" -e DC_REF -e DC_URL -w /app ${{ matrix.image }} bash tools/ci.sh

  chr:
    needs: chr-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.chr-matrix.outputs.matrix) }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHR_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: CHR live run
        id: live
        run: |
          mkdir -p .cache/chr
          test -w /dev/kvm
          KVM=(--device /dev/kvm)
          docker run --rm -v "$PWD:/app" -w /app php:8.2.35-cli bash tools/chr/tests/run.sh
          set +e
          docker run --rm -v "$PWD:/app" -v "$PWD/.cache/chr:/cache" -e CHR_CACHE=/cache -e CHR_VERSION -e DC_REF -e DC_URL \
            -w /app "${KVM[@]}" php:8.2.35-cli bash tools/chr/run-live.sh
          rc=$?
          if [ "$rc" = 78 ]; then
            echo "unavailable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"

      - name: Report removed image
        if: steps.live.outputs.unavailable == 'true' && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: await require('./tools/chr/github.cjs').report({github, context}, process.env.CHR_VERSION, true)
